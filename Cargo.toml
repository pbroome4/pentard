[package]
name = "pentard"      # Name of the compiled Rust module
version = "0.1.0"
edition = "2021"

[lib]
name = "pentard"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
rand = "0.10.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
